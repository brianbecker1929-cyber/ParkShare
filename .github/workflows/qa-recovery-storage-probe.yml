name: QA recovery private Storage access

on:
  push:
    branches: [qa/recovery-preflight-oct27]
    paths:
      - .github/workflows/qa-recovery-storage-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    if: github.repository == 'brianbecker1929-cyber/ParkShare'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check fixed source and replacement private bucket access
        env:
          QA_RECOVERY_SOURCE_SUPABASE_SECRET_KEY: ${{ secrets.QA_RECOVERY_SOURCE_SUPABASE_SECRET_KEY }}
          QA_RECOVERY_TARGET_SUPABASE_SECRET_KEY: ${{ secrets.QA_RECOVERY_TARGET_SUPABASE_SECRET_KEY }}
        run: |
          python - <<'PY'
          import base64, concurrent.futures, json, os, pathlib, urllib.request, urllib.error
          projects = [('source','biydlfekindgaslgktsx','QA_RECOVERY_SOURCE_SUPABASE_SECRET_KEY'),
                      ('replacement','heqxirlsorcztsawaldg','QA_RECOVERY_TARGET_SUPABASE_SECRET_KEY')]
          def probe(item):
              name, ref, variable = item
              key = os.environ.get(variable,'').strip()
              if not key or key.startswith('sb_publishable_'):
                  return {'project':name,'ref':ref,'credential_present':False,'http_status':None}
              headers={'apikey':key}
              if key.startswith('eyJ'):
                  try:
                      part=key.split('.')[1]
                      claims=json.loads(base64.urlsafe_b64decode(part+'='*((-len(part))%4)))
                      if claims.get('ref')!=ref or claims.get('role')!='service_role':
                          raise ValueError('Incorrect privileged key identity')
                  except Exception:
                      return {'project':name,'ref':ref,'credential_present':True,'key_identity_matches':False,'http_status':None}
                  headers['Authorization']='Bearer '+key
              elif not key.startswith('sb_secret_'):
                  return {'project':name,'ref':ref,'credential_present':True,'key_format_valid':False,'http_status':None}
              url=f'https://{ref}.supabase.co/storage/v1/bucket/listing-photos'
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=30) as response:
                      bucket=json.loads(response.read())
                      return {'project':name,'ref':ref,'credential_present':True,'http_status':response.status,'bucket_id_matches':bucket.get('id')=='listing-photos','bucket_private':bucket.get('public') is False}
              except urllib.error.HTTPError as error:
                  return {'project':name,'ref':ref,'credential_present':True,'http_status':error.code}
              except Exception:
                  return {'project':name,'ref':ref,'credential_present':True,'http_status':None,'network_error':True}
          with concurrent.futures.ThreadPoolExecutor(max_workers=2) as pool:
              results=list(pool.map(probe,projects))
          report={'source_project':'biydlfekindgaslgktsx','target_project':'heqxirlsorcztsawaldg',
                  'checks':results,'source_writes_performed':False,'target_writes_performed':False}
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'qa-storage-access.json'
          out.write_text(json.dumps(report,indent=2))
          print(json.dumps(report))
          if not all(x.get('http_status')==200 and x.get('bucket_id_matches') and x.get('bucket_private') for x in results):
              raise SystemExit('Storage copy has not run. Both private-bucket access checks must pass first.')
          PY
      - name: Retain non-sensitive access report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: parkshare-qa-storage-access-${{ github.run_id }}
          path: ${{ runner.temp }}/qa-storage-access.json
          if-no-files-found: ignore
          retention-days: 7
