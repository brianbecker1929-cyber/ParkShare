name: Independent payment alert monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '2-57/5 * * * *'

permissions:
  contents: read

concurrency:
  group: payment-alert-monitor
  cancel-in-progress: false

jobs:
  monitor:
    # Off until a separately reviewed deployment and private configuration.
    if: vars.PAYMENT_ALERT_MONITOR_ENABLED == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
      - name: Check health independently and notify without the application database
        run: node scripts/payment-alert-monitor.mjs
        env:
          PAYMENT_ALERT_MONITOR_ENVIRONMENT: ${{ vars.PAYMENT_ALERT_MONITOR_ENVIRONMENT }}
          PAYMENT_ALERT_MONITOR_SECRET: ${{ secrets.PAYMENT_ALERT_MONITOR_SECRET }}
          PAYMENT_ALERT_MONITOR_SEND_EMAIL: 'true'
          PAYMENT_ALERT_EMAIL_TO: ${{ secrets.PAYMENT_ALERT_EMAIL_TO }}
          PAYMENT_ALERT_MONITOR_FROM: ${{ vars.PAYMENT_ALERT_MONITOR_FROM }}
          RESEND_API_KEY: ${{ secrets.PAYMENT_ALERT_MONITOR_RESEND_KEY }}
